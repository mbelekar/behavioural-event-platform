services:
  kafka-a:
    image: apache/kafka:4.2.1
    container_name: kafka-a
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-a:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-a:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-a:19092 --list"]
      interval: 5s
      timeout: 10s
      retries: 12

  kafka-a-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka-a:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in behavioural.raw behavioural.valid behavioural.invalid; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-a:19092 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 1 || exit 1
        done
        # validation.dlq keeps records until an operator deletes them (ADR 0011)
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-a:19092 --create --if-not-exists \
          --topic validation.dlq --partitions 6 --replication-factor 1 --config retention.ms=-1

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    container_name: schema-registry
    depends_on:
      kafka-a:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-a:19092
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: "10000"   # default 500ms fails writes on a busy machine
    healthcheck:
      # the image has no curl; python3 is available
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
